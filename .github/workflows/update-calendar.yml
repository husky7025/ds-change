name: 학사일정 자동 갱신

on:
  schedule:
    - cron: '0 20 * * *' # 매일 오전 5시(한국 시간)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 나이스 학사일정 받기
        run: node scripts/update-neis-calendar.mjs
        env:
          SCHOOL_CODE: '7430049'
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
      - name: 변경 내용 저장
        id: save
        run: |
          if git diff --quiet -- neis-calendar.json && git ls-files --error-unmatch neis-calendar.json >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neis-calendar.json
          git commit -m "chore: update NEIS school calendar"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: 사이트 다시 빌드
        if: steps.save.outputs.changed == 'true'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
